<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Portafolio de Javiera Torres Armijo, arquitecta, diseñadora gráfica y web. Trabajos seleccionados 2020 - 2025">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="cabecera">
        <div class="contenedor cabecera__interior">
            <a href="index.html" class="cabecera__nombre">Javiera Torres Armijo</a>
            <nav aria-label="Principal">
                <ul class="menu">
                    <li class="menu__item"><a href="index.html" class="menu__enlace">Obras</a></li>
                    <li class="menu__item"><a href="sobre-mi.html" class="menu__enlace">Sobre mí</a></li>
                    <li class="menu__item"><a href="contacto.html" aria-current="page" class="boton">Contacto &rarr;</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="contenedor contacto">
        <section class="contacto__texto">
            <h1 class="titulo-gigante">Contacto</h1>
            <p class="contacto__lema">¿Tienes algún proyecto en mente? Conversemos</p>
            <div class="contacto__botones">
                <a href="mailto:torresarmijo.arq@gmail.com" class="boton">Correo:torresarmijo.arq@gmail.com &rarr;</a>
                <a href="tel:+34681098696" class="boton">Teléfono: +34 681 098 696 &rarr;</a>
            </div>
            <p class="contacto__lugar"><i class="fa-solid fa-location-dot"></i>Valencia, España</p>
        </section>
        <form action="mailto:torresarmijo.arq@gmail.com" class="formulario" method="post" enctype="text/plain">
            <div class="formulario__campo">
                <label for="nombre" class="formulario__etiqueta">Nombre</label>
                <input type="text" class="formulario__control" id="nombre" name="nombre" required>
            </div>
            <div class="formulario__campo">
                <label for="correo" class="formulario__etiqueta">Correo electrónico</label>
                <input type="email" class="formulario__control" id="correo" name="correo" required>
            </div>
            <div class="formulario__campo">
                <label for="mensaje" class="formulario__etiqueta">Mensaje</label>
                <textarea name="mensaje" id="mensaje" class="formulario__control" rows="4" required></textarea>
            </div>
            <button class="boton" type="submit" >Enviar &rarr;</button>
        </form>
    </main>    
    <footer class="pie">
        <div class="contenedor pie__interior">
            <p>&copy; Javiera Torres Armijo</p>
            <div class="pie__contacto"><a href="mailto:torresarmijo.arq@gmail.com">torresarmijo.arq@gmail.com</a><a href="https://online.fliphtml5.com/nnvds/bmsx" target="_blank" rel="noopener">Portafolio completo</a></div>
        </div>
    </footer>
    
</body>
</html>
